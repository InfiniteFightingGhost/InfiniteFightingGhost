<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%" role="img" aria-label="C# and .NET backend development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="55%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#101a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ce3c8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="850" height="220" fill="url(#bg)"/>
  <rect width="850" height="220" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="220" fill="url(#accent)" opacity="0.9"/>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="46" y="58" fill="#6ce3c8" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" letter-spacing="3">C# / .NET</text>

    <text x="46" y="116" fill="#f4f7f6" font-size="46" font-weight="700" letter-spacing="-1">Backend development</text>

    <text x="46" y="153" fill="#a7b4b0" font-size="16" letter-spacing="0.4">ASP.NET Core · EF Core · SQL Server · C# systems programming</text>

    <g transform="translate(46, 178)">
      <rect x="0" y="0" width="300" height="28" rx="14" fill="#10b981" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.35"/>
      <circle cx="16" cy="14" r="4" fill="#34d399" filter="url(#glow)"/>
      <text x="30" y="19" fill="#b9f3dd" font-size="12.5" font-family="'JetBrains Mono', Consolas, monospace">available for contract work</text>
    </g>
  </g>

  <g opacity="0.55" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#2f6f5e">
    <text x="640" y="52">GET /api/workouts</text>
    <text x="640" y="72">200 OK · 12ms</text>
    <text x="640" y="102">POST /api/workouts</text>
    <text x="640" y="122">201 Created</text>
    <text x="640" y="152">SELECT ... WHERE UserId</text>
    <text x="640" y="172">index seek</text>
  </g>

  <g stroke="#34d399" stroke-opacity="0.25" stroke-width="1">
    <line x1="610" y1="38" x2="610" y2="190"/>
  </g>
</svg>
